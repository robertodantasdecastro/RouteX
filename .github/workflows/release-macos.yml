name: Release macOS Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-alpha:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tooling/requirements-dev.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/requirements-dev.txt
          uv sync --project backend --all-extras
          cd frontend && corepack pnpm install --frozen-lockfile

      - name: Build RouteX alpha DMG
        run: make package-macos

      - name: Upload macOS alpha artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routex-macos-alpha
          path: tooling/artifacts/macos-alpha/**
          if-no-files-found: error
