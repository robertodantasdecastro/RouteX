$schema: "https://json-schema.org/draft/2020-12/schema"
title: ProviderConfig
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    const: routex.dev/v1alpha1
  kind:
    type: string
    const: ProviderConfig
  metadata:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
      owner:
        type: string
      labels:
        type: object
        additionalProperties:
          type: string
  spec:
    type: object
    additionalProperties: false
    required:
      - provider
      - enabled
      - endpoints
      - auth
      - capabilities
      - models
    properties:
      provider:
        type: string
        enum:
          - openai
          - anthropic
          - bedrock
          - ollama
          - lm-studio
          - mock
      enabled:
        type: boolean
      endpoints:
        type: object
        additionalProperties: false
        properties:
          baseUrl:
            type: string
            pattern: "^https?://"
          region:
            type: string
            minLength: 1
      auth:
        type: object
        additionalProperties: false
        required:
          - strategy
        properties:
          strategy:
            type: string
            enum:
              - env
              - secretRef
              - aws
              - none
          envVar:
            type: string
            minLength: 1
          secretRef:
            type: string
            minLength: 1
        allOf:
          - if:
              properties:
                strategy:
                  const: env
            then:
              required:
                - envVar
          - if:
              properties:
                strategy:
                  const: secretRef
            then:
              required:
                - secretRef
      capabilities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - chat
            - responses
            - embeddings
            - tools
            - vision
            - reasoning
            - json
      models:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - purpose
            - tier
          properties:
            id:
              type: string
              minLength: 1
            alias:
              type: string
              minLength: 1
            upstreamModel:
              type: string
              minLength: 1
            purpose:
              type: string
              enum:
                - chat
                - embeddings
            tier:
              type: string
              minLength: 1
            selectorTags:
              type: array
              items:
                type: string
            enabled:
              type: boolean
            endpoints:
              type: array
              items:
                type: string
                enum:
                  - chat
                  - chat_completions
                  - responses
                  - embeddings
            weight:
              type: integer
              minimum: 1
            priority:
              type: integer
              minimum: 1
            timeoutSeconds:
              type: number
              minimum: 1
            streamTimeoutSeconds:
              type: number
              minimum: 1
            region:
              type: string
              minLength: 1
            isLocal:
              type: boolean
            metadata:
              type: object
              additionalProperties: true
