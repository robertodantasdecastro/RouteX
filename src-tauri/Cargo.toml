[package]
name = "routex-desktop"
version = "0.1.0"
description = "RouteX desktop shell"
authors = ["Roberto Dantas de Castro"]
edition = "2021"

[lib]
name = "routex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", features = ["image-png", "tray-icon"] }
ureq = { version = "2.12.1", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
